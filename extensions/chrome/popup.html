<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 3px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #4338ca;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .success { color: #34d399; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h2>⚡ AI Recruiter Job Clipper</h2>
  <div class="field">
    <label>Job Title</label>
    <input type="text" id="title" required>
  </div>
  <div class="field">
    <label>Company</label>
    <input type="text" id="company" required>
  </div>
  <div class="field">
    <label>Posting URL</label>
    <input type="url" id="url" required>
  </div>
  <div class="field">
    <label>Estimated Salary ($)</label>
    <input type="number" id="salary" placeholder="185000">
  </div>
  <button id="clipBtn">Clip to AI Recruiter Pipeline</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
