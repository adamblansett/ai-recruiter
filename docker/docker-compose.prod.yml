services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_recruiter_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  redis:
    image: redis:7.2-alpine
    container_name: ai_recruiter_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  ai_engine:
    image: ollama/ollama:latest
    container_name: ai_recruiter_ai_engine_prod
    restart: always
    volumes:
      - ollama_prod_data:/root/.ollama
    networks:
      - internal_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ai_recruiter_backend_prod
    restart: always
    environment:
      - APP_NAME=AI Recruiter
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AI_PROVIDER_DEFAULT=builtin
      - OLLAMA_BASE_URL=http://ai_engine:11434
      - BUILTIN_MODEL_NAME=llama3.2:3b
    volumes:
      - uploads_prod_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_engine:
        condition: service_started
    networks:
      - internal_network

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ai_recruiter_celery_worker_prod
    restart: always
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=warning", "--concurrency=4"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - uploads_prod_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ai_recruiter_celery_beat_prod
    restart: always
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ai_recruiter_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  ollama_prod_data:
  uploads_prod_data:
